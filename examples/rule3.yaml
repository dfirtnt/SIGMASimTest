title: Suspicious PowerShell Download Copy
id: abcdef12-3456-7890-abcd-ef1234567890
status: experimental
description: Detects suspicious PowerShell download activity (duplicate)
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'Invoke-WebRequest'
      - 'wget'
      - 'curl'
      - 'Net.WebClient'
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  filter:
    CommandLine|contains:
      - 'chocolatey'
      - 'winget'
  condition: selection and not filter
falsepositives:
  - Legitimate administrative scripts
level: high
