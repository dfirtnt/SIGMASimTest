name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Verify pyyaml is the only runtime dependency
        run: |
          python - <<'PY'
          import importlib.metadata as md
          deps = md.requires("sigma-atom-similarity") or []
          assert deps == ["pyyaml==6.0.3"], deps
          print("runtime deps ok:", deps)
          PY

      - name: Verify the public API is importable
        run: |
          python -c "from sigma_similarity import compare_rules, SimilarityResult, UnsupportedSigmaFeatureError, UnknownTelemetryClassError, DeterministicExpansionLimitError; print('api ok')"

      - name: Test
        run: pytest -q
